{{- $event := .Event -}}
{{- $site := .Site -}}
<div class="event-card" data-date="{{ $event.date }}" data-start="{{ $event.start }}" data-end="{{ $event.end }}"{{ with $event.tags }} data-tags="{{ delimit . " " }}"{{ end }}{{ with $event.start_address }} data-start-address="{{ . }}"{{ end }}{{ if $event.recurring }} data-recurring="true"{{ end }}>
    <div class="event-info">
        <span class="link-title">{{ $event.title }}</span>
        {{ with $event.date }}<span class="link-subtitle">{{ . }}</span>{{ end }}
        {{ with $event.tags }}
        <div class="event-tags">
            {{ range . }}<button class="event-tag" data-tag="{{ . }}">{{ . }}</button>{{ end }}
        </div>
        {{ end }}
    </div>
    <div class="event-actions">
        <a href="{{ $event.url }}" target="_blank" rel="noopener" class="event-button" data-goatcounter-click="{{ with urls.Parse $site.BaseURL }}{{ .Host }}{{ end }}-{{ $event.title | urlize }}-event-ext-{{ $event.url }}">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
            </svg>
            View Event
        </a>
        {{ with $event.route }}
        <a href="{{ . }}" target="_blank" rel="noopener" class="route-button" data-goatcounter-click="{{ with urls.Parse $site.BaseURL }}{{ .Host }}{{ end }}-{{ $event.title | urlize }}-route-ext-{{ . }}">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            Route
        </a>
        {{ end }}
        <button class="share-button" data-event-title="{{ $event.title }}" data-event-date="{{ $event.date }}" data-event-url="{{ $event.url }}" data-goatcounter-click="{{ with urls.Parse $site.BaseURL }}{{ .Host }}{{ end }}-{{ $event.title | urlize }}-event-copy-ext-{{ $event.url }}" aria-label="Share event">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
            </svg>
        </button>
    </div>
</div>
