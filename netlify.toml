[build]
  command = "npm install && npx esbuild src/main.ts --bundle --minify --sourcemap --target=es2020 --outfile=themes/linkpage/static/js/main.js && go run ./cmd/generate-events && hugo --gc --minify --baseURL ${DEPLOY_URL:-https://ridewestside.org}/ && go run ./cmd/buildpdf"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.140.1"
  TZ = "America/Los_Angeles"
  GO_VERSION = "1.21"

# Deploy previews (PRs) render drafts and future-dated content so we can
# review work-in-progress pages before flipping `draft: false`.
[context.deploy-preview]
  command = "npm install && npx esbuild src/main.ts --bundle --minify --sourcemap --target=es2020 --outfile=themes/linkpage/static/js/main.js && go run ./cmd/generate-events && hugo --gc --minify --buildDrafts --buildFuture --baseURL ${DEPLOY_URL:-https://ridewestside.org}/ && go run ./cmd/buildpdf"

# Branch deploys (non-main branches) also render drafts.
[context.branch-deploy]
  command = "npm install && npx esbuild src/main.ts --bundle --minify --sourcemap --target=es2020 --outfile=themes/linkpage/static/js/main.js && go run ./cmd/generate-events && hugo --gc --minify --buildDrafts --buildFuture --baseURL ${DEPLOY_URL:-https://ridewestside.org}/ && go run ./cmd/buildpdf"
